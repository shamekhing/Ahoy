# Codemagic CI/CD configuration for Ahoy https://codemagic.io
#
# Workflow `ios-release` builds a signed App Store IPA of the Flutter app
# (bundle id com.ahoy.app) and publishes it as an artifact.
#
# One-time setup in the Codemagic dashboard (cannot be done from this repo):
#
#   1. App Store Connect → Users and Access → Integrations/Keys: generate an
#      API key with the "App Manager" role, note the Issuer ID and the Key ID
#      (AuthKey_XXXXXXXXXX.p8), and download the .p8 file.
#   2. Codemagic → Teams → Global variables & secrets (or the app's
#      Variables tab): create a variable group named `appstore_credentials`
#      with exactly these variables:
#        APP_STORE_CONNECT_ISSUER_ID      = <issuer id>
#        APP_STORE_CONNECT_KEY_IDENTIFIER = <key id>
#        APP_STORE_CONNECT_PRIVATE_KEY    = <full contents of the .p8 file>
#      Mark APP_STORE_CONNECT_PRIVATE_KEY as sensitive.
#   3. Connect the GitHub repository in Codemagic and enable webhooks so the
#      push trigger below fires for the main branch.
#
# The `app-store-connect fetch-signing-files --create` step resolves the
# "No matching profiles found for bundle identifier com.ahoy.app and
# distribution type app_store" error: it reuses an existing App Store
# distribution certificate and profile when present, and otherwise creates
# them (registering the bundle id with Apple if needed), provided the API
# key has the App Manager role.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          source: true
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run Flutter tests
        script: flutter test
      - name: Initialize keychain for code signing
        script: keychain initialize
      - name: Fetch or create App Store signing resources
        script: |
          app-store-connect fetch-signing-files com.ahoy.app \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing settings to the Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

